<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- DEMOSTRACIÓN CON DATOS DE EJEMPLO. Tienda, ventas y compradores son
     inventados. Se usa para enseñar cómo se ve el panel cuando se vende.
     Fuera del índice de Google a propósito: unas ventas de mentira no pueden
     aparecer en un resultado como si fueran reales. -->
<meta name="robots" content="noindex, nofollow" />
<title>Demostración del panel — Mercatren</title>
<style>
  :root{
    --riel:#10263A; --riel-900:#0f1f30; --carga:#FF6B1A; --carga-600:#e85f12;
    --fondo:#F6F8FB; --borde:#E2E8F0; --tinta:#0F172A; --suave:#64748B;
    --verde:#059669; --verde-50:#ECFDF5; --verde-200:#A7F3D0;
    --ambar:#B45309; --ambar-50:#FFFBEB; --ambar-300:#FCD34D;
    --rojo:#B91C1C; --rojo-50:#FEF2F2; --gris-pill:#E2E8F0;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;color:var(--tinta);background:var(--fondo);font-size:15px;line-height:1.45}
  .tab{font-variant-numeric:tabular-nums}
  a{color:inherit}
  button{font:inherit;cursor:pointer}
  /* ── layout ── */
  .app{display:grid;grid-template-columns:16rem 1fr;min-height:100vh}
  .lateral{background:var(--riel);color:#fff;display:flex;flex-direction:column;padding:1.1rem .75rem;position:sticky;top:0;height:100vh;overflow-y:auto}
  .marca{display:flex;gap:.6rem;align-items:center;padding:0 .5rem .9rem}
  .marca .iso{width:36px;height:36px;border-radius:10px;background:rgba(255,107,26,.18);display:grid;place-items:center}
  .marca b{display:block;font-size:.95rem} .marca small{color:rgba(255,255,255,.55);font-size:.75rem}
  .grupo{margin-top:1.1rem} .grupo h2{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.4);margin:0 .75rem .35rem;font-weight:600}
  .item{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:0;background:transparent;color:rgba(255,255,255,.85);padding:.55rem .75rem;border-radius:8px;font-size:.92rem;position:relative}
  .item svg{width:17px;height:17px;flex:none;opacity:.85}
  .item:hover{background:rgba(255,255,255,.06)}
  .item.activo{background:rgba(255,255,255,.1);color:#fff;font-weight:600}
  .item.activo::before{content:"";position:absolute;left:-.75rem;top:6px;bottom:6px;width:3px;background:var(--carga);border-radius:0 3px 3px 0}
  .item .pill{margin-left:auto;background:var(--carga);color:#fff;font-size:.68rem;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
  .item.apagado{opacity:.55;cursor:default}
  .pie-lateral{margin-top:auto;padding-top:1rem;border-top:1px solid rgba(255,255,255,.08)}
  .pie-lateral .item{font-size:.85rem;color:rgba(255,255,255,.7)}
  .principal{min-width:0}
  .barra{background:#fff;border-bottom:1px solid var(--borde);display:flex;justify-content:flex-end;align-items:center;gap:.6rem;padding:.6rem 1.5rem;font-size:.85rem;color:var(--suave)}
  .barra .pais{border:1px solid var(--borde);border-radius:8px;padding:.35rem .7rem;color:var(--tinta);font-weight:600;font-size:.85rem;background:#fff}
  .contenido{padding:1.6rem 1.5rem 3rem;max-width:1200px}
  h1{font-size:1.55rem;margin:0 0 .25rem;letter-spacing:-.01em}
  .sub{color:var(--suave);font-size:.92rem;margin:0 0 1.2rem}
  /* ── tarjetas ── */
  .tarjetas{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:1rem}
  .tarjeta{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:.95rem 1.05rem;position:relative}
  .tarjeta.destacada{border-color:rgba(255,107,26,.55);box-shadow:0 0 0 3px rgba(255,107,26,.12)}
  .tarjeta.oscura{background:var(--riel);color:#fff;border-color:var(--riel)}
  .tarjeta .k{font-size:.8rem;color:var(--suave)} .tarjeta.oscura .k{color:rgba(255,255,255,.7)}
  .tarjeta .v{font-size:1.55rem;font-weight:800;margin:.15rem 0 .1rem;letter-spacing:-.01em}
  .tarjeta .p{font-size:.78rem;color:var(--suave)} .tarjeta.oscura .p{color:rgba(255,255,255,.6)}
  .tarjeta .ic{position:absolute;right:.9rem;top:.9rem;width:28px;height:28px;border-radius:8px;background:rgba(255,107,26,.12);display:grid;place-items:center;color:var(--carga)}
  .tarjeta .ic svg{width:15px;height:15px}
  /* ── paneles/listas ── */
  .panel{background:#fff;border:1px solid var(--borde);border-radius:14px;padding:1rem 1.1rem;margin-bottom:1rem}
  .panel h3{margin:0 0 .6rem;font-size:1rem}
  .fila{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-top:1px solid var(--borde)}
  .fila:first-of-type{border-top:0}
  .fila .ico{width:36px;height:36px;border-radius:10px;background:#F1F5F9;display:grid;place-items:center;flex:none;color:var(--suave)}
  .fila .ico svg{width:17px;height:17px}
  .fila .cuerpo{min-width:0;flex:1}
  .fila .t1{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-weight:700}
  .fila .t2{font-size:.83rem;color:var(--suave);margin-top:.1rem}
  .fila .monto{font-weight:800;font-size:1.05rem;white-space:nowrap}
  .fila .lapiz{font-size:.78rem;color:var(--suave)}
  .estado{font-size:.72rem;font-weight:700;border-radius:999px;padding:.15rem .55rem;white-space:nowrap}
  .e-verde{background:var(--verde-50);color:var(--verde)} .e-ambar{background:var(--ambar-50);color:var(--ambar)}
  .e-gris{background:var(--gris-pill);color:#475569} .e-azul{background:#EFF6FF;color:#1D4ED8}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
  .lista-scroll{max-height:62vh;overflow:auto;padding-right:.25rem}
  .detalle{display:none;background:#F8FAFC;border:1px dashed var(--borde);border-radius:10px;padding:.6rem .8rem;margin:.4rem 0 .2rem 3.2rem;font-size:.85rem}
  .detalle.abierto{display:block}
  .detalle .r{display:flex;justify-content:space-between;gap:1rem;padding:.2rem 0}
  .detalle .r.total{border-top:1px solid var(--borde);margin-top:.3rem;padding-top:.4rem;font-weight:700}
  .pestanas{display:flex;gap:.4rem;margin:.2rem 0 1rem;flex-wrap:wrap}
  .pestana{border:1px solid var(--borde);background:#fff;border-radius:999px;padding:.4rem .9rem;font-size:.85rem;font-weight:600;color:var(--tinta);display:flex;gap:.4rem;align-items:center}
  .pestana.activa{background:var(--riel);color:#fff;border-color:var(--riel)}
  .boton{display:inline-flex;align-items:center;gap:.45rem;white-space:nowrap;background:var(--carga);color:#fff;border:0;border-radius:10px;padding:.6rem 1rem;font-weight:700;font-size:.9rem}
  .boton:hover{background:var(--carga-600)}
  .boton.sec{background:#fff;color:var(--tinta);border:1px solid var(--borde)} .boton.sec:hover{border-color:var(--carga)}
  .boton.chico{padding:.4rem .7rem;font-size:.8rem;border-radius:8px}
  .buscador{display:flex;align-items:center;gap:.6rem;margin-bottom:.9rem}
  .buscador input{flex:1;max-width:520px;border:1px solid var(--borde);border-radius:10px;padding:.55rem .8rem .55rem 2.1rem;font:inherit;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' stroke='%2364748B' stroke-width='2'><circle cx='7' cy='7' r='5'/><path d='m11 11 3.5 3.5'/></svg>") .7rem center no-repeat}
  .buscador span{font-size:.85rem;color:var(--suave)}
  .esperando{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .esperando .r{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--borde);border-radius:10px;padding:.55rem .8rem;font-size:.9rem}
  .esperando .n{background:var(--gris-pill);border-radius:999px;font-size:.75rem;font-weight:800;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}
  .esperando .n.hay{background:var(--carga);color:#fff}
  .pasos{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin:.4rem 0 .2rem}
  .paso{text-align:center;font-size:.72rem;color:var(--suave);position:relative}
  .paso i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto .25rem;border:2px solid var(--borde);background:#fff}
  .paso.hecho i{background:var(--verde);border-color:var(--verde)} .paso.hecho{color:var(--tinta);font-weight:600}
  .paso:not(:last-child)::after{content:"";position:absolute;top:10px;left:calc(50% + 13px);width:calc(100% - 26px);height:2px;background:var(--borde)}
  .paso.hecho:not(:last-child)::after{background:var(--verde)}
  /* ── formulario de retiro ── */
  .form{display:grid;gap:.8rem;grid-template-columns:repeat(2,minmax(0,1fr))}
  .form label{display:block;font-size:.85rem;font-weight:600}
  .form input,.form select{width:100%;margin-top:.3rem;border:1px solid var(--borde);border-radius:10px;padding:.55rem .7rem;font:inherit;background:#fff}
  .form input:focus,.form select:focus{outline:none;border-color:var(--carga);box-shadow:0 0 0 3px rgba(255,107,26,.2)}
  .form .ancha{grid-column:1/-1}
  .ayuda{font-size:.78rem;color:var(--suave);font-weight:400;margin-top:.2rem}
  .desglose{background:#F8FAFC;border:1px solid var(--borde);border-radius:12px;padding:.8rem 1rem;margin:.2rem 0 1rem}
  .desglose .r{display:flex;justify-content:space-between;gap:1rem;padding:.25rem 0;font-size:.9rem}
  .desglose .r.total{border-top:1px solid var(--borde);margin-top:.35rem;padding-top:.5rem;font-weight:800;font-size:1rem}
  .desglose .r span:first-child{color:var(--suave)} .desglose .r.total span:first-child{color:var(--tinta)}
  .aviso{border-radius:12px;padding:.75rem 1rem;font-size:.88rem;margin-bottom:1rem}
  .aviso.verde{background:var(--verde-50);border:1px solid var(--verde-200);color:#065F46}
  .aviso.ambar{background:var(--ambar-50);border:1px solid var(--ambar-300);color:var(--ambar)}
  .radio2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
  .radio2 button{border:1px solid var(--borde);background:#fff;border-radius:12px;padding:.7rem .8rem;text-align:left}
  .radio2 button.sel{border-color:var(--carga);background:rgba(255,107,26,.05);box-shadow:0 0 0 2px rgba(255,107,26,.25)}
  .radio2 b{display:block;font-size:.9rem} .radio2 small{color:var(--suave);font-size:.78rem}
  /* ── toast y cinta de demo ── */
  .toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(20px);background:var(--riel);color:#fff;padding:.7rem 1rem;border-radius:12px;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .toast.ver{opacity:1;transform:translateX(-50%) translateY(0)}
  .cinta{position:fixed;right:.9rem;bottom:.9rem;font-size:.7rem;color:var(--suave);background:rgba(255,255,255,.85);border:1px solid var(--borde);border-radius:999px;padding:.25rem .6rem;backdrop-filter:blur(4px)}
  .oculto{display:none !important}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .lateral{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:.25rem;padding:.6rem .6rem}
    .marca,.grupo h2,.pie-lateral{display:none}
    .grupo{display:flex;margin:0;gap:.25rem} .item{white-space:nowrap;padding:.45rem .7rem;font-size:.85rem} .item.activo::before{display:none}
    .contenido{padding:1rem .9rem 2.5rem} .form{grid-template-columns:1fr} .lista-scroll{max-height:none}
    .pasos{grid-template-columns:repeat(5,1fr)} .paso{font-size:.62rem}
  }
</style>
</head>

const ordenes = VENTAS.map((v,i)=>{
  const [dia, comprador, metodo, estado, renglones] = v;
  const items = renglones.map(([k,q])=>({nombre:P[k][0],precio:P[k][1],cant:q,total:r2(P[k][1]*q)}));
  const bruto = r2(items.reduce((s,x)=>s+x.total,0));
  const comision = r2(bruto*COMISION);
  const stripe = metodo==="tarjeta" ? r2(bruto*STRIPE_PCT+STRIPE_FIJO) : 0;
  const neto = r2(bruto-comision-stripe);
  const numero = "MT-"+String(1180+i).padStart(6,"0");
  const oc = "MT-OC-"+String(412+i).padStart(6,"0");
  const ref = metodo==="tarjeta" ? "pi_3R"+(7100+i*37).toString(36).toUpperCase()+"x" : "Z-"+(88210+i*13);
  return {dia,comprador,metodo,estado,items,bruto,comision,stripe,neto,numero,oc,ref};
});
let retiros = RETIROS.map(r=>({...r}));
const tot = () => {
  const bruto = r2(ordenes.reduce((s,o)=>s+o.bruto,0));
  const comision = r2(ordenes.reduce((s,o)=>s+o.comision,0));
  const stripe = r2(ordenes.reduce((s,o)=>s+o.stripe,0));
  const neto = r2(bruto-comision-stripe);
  const pagado = r2(retiros.filter(r=>r.estado==="pagado").reduce((s,r)=>s+r.monto,0));
  const solicitado = r2(retiros.filter(r=>r.estado==="solicitado").reduce((s,r)=>s+r.monto,0));
  const disponible = r2(neto-pagado-solicitado);
  const hoy = ordenes.filter(o=>o.dia===22);
  return {bruto,comision,stripe,neto,pagado,solicitado,disponible,hoy:r2(hoy.reduce((s,o)=>s+o.bruto,0)),nHoy:hoy.length,n:ordenes.length,
    entregadas:ordenes.filter(o=>o.estado==="entregado").length, porDespachar:ordenes.filter(o=>o.estado==="pagado").length, nPagados:retiros.filter(r=>r.estado==="pagado").length};
};

  const T=t().ordenes, s=tot();
  const lista=[...ordenes].sort((a,b)=>b.dia-a.dia || b.numero.localeCompare(a.numero));
  const pasos=(e)=>{const n=e==="entregado"?5:e==="enviado"?3:2;return `<div class="pasos">${T.pasos.map((p,i)=>`<div class="paso ${i<n?"hecho":""}"><i></i>${p}</div>`).join("")}</div>`;};
  return `<h1>${T.t}</h1><p class="sub">${T.s}</p>
  <div class="buscador"><input placeholder="${T.buscar}" /><span>${T.total.replace("{n}",s.n).replace("{m}",usd(s.bruto))}</span></div>
  <div class="panel lista-scroll" id="listaOrdenes">
    ${lista.map(o=>`<div class="fila" data-abrir="${o.numero}" style="cursor:pointer"><span class="ico">${I.bolsa}</span><div class="cuerpo"><div class="t1"><span class="mono">${o.numero}</span>${estadoPill(o.estado)}${metodoPill(o.metodo)}</div><div class="t2">${t().fecha(o.dia)} · ${o.comprador} · ${o.items.map(i=>i.cant+"× "+i.nombre).join(" · ").slice(0,90)}${o.items.map(i=>i.nombre).join("").length>90?"…":""}</div></div><div class="monto tab">${usd(o.bruto)}</div></div>
    <div class="detalle ${abiertas.has(o.numero)?"abierto":""}" data-det="${o.numero}">
      ${pasos(o.estado)}
      ${o.items.map(i=>`<div class="r"><span>${i.cant}${T.x}${i.nombre}</span><span class="tab">${usd(i.total)}</span></div>`).join("")}
      <div class="r total"><span>${T.subtotal}</span><span class="tab">${usd(o.bruto)}</span></div>
      <div class="r"><span>${T.comision}</span><span class="tab">− ${usd(o.comision)}</span></div>
      ${o.stripe?`<div class="r"><span>${LANG==="es"?"Procesador de tarjeta":"Card processor"}</span><span class="tab">− ${usd(o.stripe)}</span></div>`:""}
      <div class="r total"><span>${T.neto}</span><span class="tab" style="color:var(--verde)">${usd(o.neto)}</span></div>
      <div class="r" style="color:var(--suave)"><span>${T.metodo[o.metodo]} · ${LANG==="es"?"ref.":"ref."} <span class="mono">${o.ref}</span></span><span class="mono">${o.oc}</span></div>
    </div>`).join("")}
  </div>`;
}

function vCobros(){
  const T=t().cobros;
  const tarjetas=ordenes.filter(o=>o.metodo==="tarjeta").sort((a,b)=>b.dia-a.dia);
  const zelles=ordenes.filter(o=>o.metodo==="zelle").sort((a,b)=>b.dia-a.dia);
  const tabs=T.tabs.map((x,i)=>`<button class="pestana ${tabCobros===i?"activa":""}" data-tab="${i}">${[I.tarjeta,I.banco,I.enlace][i]}${x}</button>`).join("");
  let cuerpo="";
  if(tabCobros===0) cuerpo=`<p class="sub">${T.tarjetaS}</p><div class="panel lista-scroll">${tarjetas.map(o=>`<div class="fila"><span class="ico">${I.tarjeta}</span><div class="cuerpo"><div class="t1"><span class="mono">${o.numero}</span><span class="estado e-verde">${LANG==="es"?"Confirmado":"Confirmed"}</span></div><div class="t2">${t().fecha(o.dia)} · ${o.comprador} · ${T.ref} <span class="mono">${o.ref}</span></div></div><div class="monto tab">${usd(o.bruto)}</div></div>`).join("")}</div>`;
  else if(tabCobros===1) cuerpo=`<p class="sub">${T.zelleS}</p><div class="panel lista-scroll">${zelles.map(o=>`<div class="fila"><span class="ico">${I.banco}</span><div class="cuerpo"><div class="t1"><span class="mono">${o.numero}</span><span class="estado e-verde">${T.aprobado}</span></div><div class="t2">${t().fecha(o.dia)} · ${o.comprador} · Mercatren ${o.numero.slice(3)} · ${T.ref} <span class="mono">${o.ref}</span></div></div><div class="monto tab">${usd(o.bruto)}</div></div>`).join("")}</div>`;
  else cuerpo=`<p class="sub">${T.enlacesS}</p><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.4rem"><b>${T.tabs[2]}</b><button class="boton chico">${I.enlace}${T.pedir}</button></div>
    ${ENLACES.map(e=>`<div class="fila"><span class="ico">${I.enlace}</span><div class="cuerpo"><div class="t1"><span class="mono">${e.ref}</span><span class="estado ${e.estado==="pagado"?"e-verde":e.estado==="abierto"?"e-ambar":"e-gris"}">${T.enlaceEstado[e.estado]}</span>${e.metodo?metodoPill(e.metodo):""}</div><div class="t2">${t().fecha(e.dia)} · ${e.correo} · ${e.concepto}${e.vence?` · ${T.vence.replace("{d}",e.vence)}`:""}</div></div><div class="monto tab">${usd(e.monto)}</div></div>`).join("")}</div>`;
  return `<h1>${T.t}</h1><p class="sub">${T.s}</p><div class="pestanas">${tabs}</div>${cuerpo}`;
}

function vDinero(){
  const T=t().dinero, s=tot();
  const movs=[
    ...ordenes.map(o=>({dia:o.dia,tipo:"acred",txt:`${T.acred} · ${o.numero} · ${o.comprador}`,monto:o.neto})),
    ...retiros.map(r=>({dia:r.dia,tipo:r.estado==="solicitado"?"solic":"retiro",txt:`${r.estado==="solicitado"?T.solic:T.retiro} · ${t().retiros.via[r.via]}`,monto:-r.monto})),
  ].sort((a,b)=>b.dia-a.dia);
  return `<h1>${T.t}</h1><p class="sub">${T.s}</p>
  <div class="tarjetas">
    ${tarjeta(T.pagaron,usd(s.bruto),T.pagaronP,{ic:"bolsa"})}
    ${tarjeta(T.proc,"− "+usd(s.stripe),T.procP,{ic:"tarjeta"})}
    ${tarjeta(T.com,"− "+usd(s.comision),T.comP,{ic:"tag"})}
    ${tarjeta(T.quedo,usd(s.neto),T.quedoP,{ic:"check"})}
    ${tarjeta(T.disp,usd(s.disponible),T.dispP,{cls:"destacada",ic:"wallet"})}
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin:.2rem 0 .8rem"><h3 style="margin:0">${T.mov}</h3><button class="boton" data-ir="retiros" data-abrir-form="1">${I.wallet}${T.pedirRetiro}</button></div>
  <div class="panel lista-scroll">
    ${movs.map(m=>`<div class="fila"><span class="ico">${m.tipo==="acred"?I.bolsa:I.retiros}</span><div class="cuerpo"><div class="t1" style="font-weight:600">${m.txt}</div><div class="t2">${t().fecha(m.dia)}</div></div><div class="monto tab" style="color:${m.monto<0?"var(--tinta)":"var(--verde)"}">${m.monto<0?"− "+usd(-m.monto):"+ "+usd(m.monto)}</div></div>`).join("")}
  </div>`;
}

function formRetiro(){
  const T=t().retiros.f, s=tot();
  const campos = {
    US: `<div><label>${T.ruta}<input placeholder="021000021" inputmode="numeric" /></label><div class="ayuda">${T.rutaA}</div></div><label>${T.cuenta}<input placeholder="0000000000" inputmode="numeric" /></label>`,
    CO: `<label>${T.tipo}<select><option>${T.ahorros}</option><option>${T.corriente}</option></select></label><label>${T.cuenta}<input placeholder="000-000000-00" /></label><label class="ancha">${T.doc}<input placeholder="NIT / CC" /></label>`,
    MX: `<label class="ancha">${T.clabe}<input placeholder="000000000000000000" inputmode="numeric" /></label><div class="ayuda" style="grid-column:1/-1;margin-top:-.4rem">${T.clabeA}</div>`,
    ES: `<label>${T.iban}<input placeholder="ES00 0000 0000 0000 0000 0000" /></label><label>${T.swift}<input placeholder="XXXXESMMXXX" /></label>`,
  }[paisRetiro] || `<label>${T.cuenta}<input /></label><label>${T.swift}<input /></label>`;
  const paises = [["US","Estados Unidos"],["CO","Colombia"],["MX","México"],["ES","España"],["CL","Chile"],["PE","Perú"],["AR","Argentina"],["BR","Brasil"],["PA","Panamá"],["DO","República Dominicana"]];
  return `<div class="panel" id="formRetiro">
    <h3>${t().retiros.pedir}</h3>
    <div class="radio2" style="margin-bottom:.9rem">
      <button class="${tipoRetiro==="banco"?"sel":""}" data-tipo="banco"><b>${T.banco}</b><small>${T.bancoS}</small></button>
      <button class="${tipoRetiro==="otro"?"sel":""}" data-tipo="otro"><b>${T.otro}</b><small>${T.otroS}</small></button>
    </div>
    <div class="desglose">
      <div style="font-weight:700;font-size:.85rem;margin-bottom:.3rem">${T.desg}</div>
      <div class="r"><span>${T.d1}</span><span class="tab">${usd(s.bruto)}</span></div>
      <div class="r"><span>${T.d2}</span><span class="tab">− ${usd(s.stripe)}</span></div>
      <div class="r"><span>${T.d3}</span><span class="tab">− ${usd(s.comision)}</span></div>
      <div class="r"><span>${T.d4}</span><span class="tab">${usd(s.neto)}</span></div>
      <div class="r"><span>${T.d5}</span><span class="tab">− ${usd(r2(s.pagado+s.solicitado))}</span></div>
      <div class="r total"><span>${T.d6}</span><span class="tab" style="color:var(--verde)">${usd(s.disponible)}</span></div>
    </div>
    <div class="form">
      ${tipoRetiro==="banco"?`
      <label>${T.pais}<select id="selPais">${paises.map(([c,n])=>`<option value="${c}" ${c===paisRetiro?"selected":""}>${n}</option>`).join("")}</select></label>
      <label>${T.titular}<input value="${TIENDA.nombre}" /></label>
      <label>${T.bancoN}<input placeholder="${paisRetiro==="US"?"Chase, Bank of America…":paisRetiro==="CO"?"Bancolombia, Davivienda…":""}" /></label>
      ${campos}`:`<label class="ancha">${LANG==="es"?"Comercio que recibe":"Receiving merchant"}<input placeholder="${LANG==="es"?"Nombre o dirección de su tienda":"Store name or address"}" /></label>`}
      <div class="ancha"><label>${T.monto}<div style="display:flex;gap:.5rem;margin-top:.3rem"><input id="montoRetiro" inputmode="decimal" placeholder="0.00" style="margin:0" /><button class="boton sec" id="btnTodo" type="button">${T.todo}</button></div></label><div class="ayuda">${T.montoA.replace("{m}",usd(s.disponible))}</div></div>
      <div class="ancha" id="avisoRetiro"></div>
      <div class="ancha" style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="boton" id="btnPedir">${I.wallet}${T.enviar}</button><button class="boton sec" id="btnCancelar">${T.cancelar}</button></div>
    </div>
  </div>`;
}

function vRetiros(){
  const T=t().retiros, s=tot();
  const lista=[...retiros].sort((a,b)=>b.dia-a.dia);
  return `<h1>${T.t}</h1><p class="sub">${T.s}</p>
  <div class="tarjetas" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    ${tarjeta(T.disp,usd(s.disponible),"",{cls:"destacada"})}
    ${tarjeta(T.pedido,usd(s.solicitado),"")}
    ${tarjeta(T.pend,usd(r2(s.disponible+s.solicitado)),"")}
  </div>
  ${formAbierto?formRetiro():`<div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:.9rem"><div class="buscador" style="margin:0;flex:1"><input placeholder="${T.buscar}" /><span>${T.n.replace("{n}",retiros.length)}</span></div>${s.disponible>0?`<button class="boton" id="abrirForm">${I.wallet}${T.pedir}</button>`:""}</div>`}
  <div class="panel">
    ${lista.map(r=>`<div class="fila"><span class="ico">${I.banco}</span><div class="cuerpo"><div class="t1"><span class="tab">${usd(r.monto)}</span><span class="estado ${r.estado==="pagado"?"e-verde":r.estado==="solicitado"?"e-ambar":"e-gris"}">${T.estado[r.estado]}</span></div><div class="t2">${T.via[r.via]} · ${r.cuenta}</div><div class="t2">${t().fecha(r.dia)} · ${TIENDA.nombre}${r.ref?" · "+r.ref:""}</div>${r.estado==="pagado"?`<button class="boton sec chico" style="margin-top:.45rem;border-color:var(--verde-200);background:var(--verde-50);color:var(--verde)">${I.clip}${T.comprobante}</button>`:""}</div></div>`).join("")}
  </div>`;
}

function vFacturas(){
  const T=t().facturas;
  const lista=[...ordenes].sort((a,b)=>b.dia-a.dia);
  return `<h1>${T.t}</h1><p class="sub">${T.s}</p>
  <div class="panel lista-scroll">${lista.map((o,i)=>{const fact=o.estado!=="pagado"; return `<div class="fila"><span class="ico">${I.facturas}</span><div class="cuerpo"><div class="t1"><span class="mono">${o.oc}</span><span class="estado ${fact?"e-verde":"e-ambar"}">${T.estado[fact?"facturada":"emitida"]}</span></div><div class="t2">${t().fecha(o.dia)} · ${T.por} <span class="mono">${o.numero}</span> · ${o.items.length} ${LANG==="es"?"renglones":"lines"}</div>${fact?"":`<button class="boton sec chico" style="margin-top:.45rem">${I.clip}${T.subir}</button>`}</div><div style="text-align:right"><div class="monto tab">${usd(o.neto)}</div><div class="lapiz">${T.monto}</div></div></div>`;}).join("")}</div>`;
}

function render(){
  lateral();
  const v={tablero:vTablero,ordenes:vOrdenes,cobros:vCobros,dinero:vDinero,retiros:vRetiros,facturas:vFacturas}[pantalla];
  $("#contenido").innerHTML=v();
  window.scrollTo(0,0);
  // navegación desde botones del contenido
  $("#contenido").querySelectorAll("[data-ir]").forEach(b=>b.onclick=()=>{pantalla=b.dataset.ir;formAbierto=Boolean(b.dataset.abrirForm);render();});
  $("#contenido").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tabCobros=+b.dataset.tab;render();});
  $("#contenido").querySelectorAll("[data-abrir]").forEach(f=>f.onclick=()=>{const k=f.dataset.abrir;abiertas.has(k)?abiertas.delete(k):abiertas.add(k);$(`[data-det="${k}"]`).classList.toggle("abierto");});
  const ab=$("#abrirForm"); if(ab) ab.onclick=()=>{formAbierto=true;render();$("#formRetiro")?.scrollIntoView({behavior:"smooth",block:"start"});};
  if(formAbierto && pantalla==="retiros"){
    $("#contenido").querySelectorAll("[data-tipo]").forEach(b=>b.onclick=()=>{tipoRetiro=b.dataset.tipo;render();});
    const sel=$("#selPais"); if(sel) sel.onchange=()=>{paisRetiro=sel.value;render();$("#formRetiro")?.scrollIntoView({behavior:"smooth",block:"start"});};
    $("#btnTodo").onclick=()=>{$("#montoRetiro").value=tot().disponible.toFixed(2);};
    $("#btnCancelar").onclick=()=>{formAbierto=false;render();};
    $("#btnPedir").onclick=()=>{
      const T=t().retiros.f, s=tot();
      const n=parseFloat(($("#montoRetiro").value||"").replace(",","."));
      const av=$("#avisoRetiro");
      if(!n||n<=0){av.innerHTML=`<div class="aviso ambar">${T.cero}</div>`;return;}
      if(n>s.disponible+0.001){av.innerHTML=`<div class="aviso ambar">${T.mas}</div>`;return;}
      retiros.push({id:"r"+(retiros.length+1),dia:22,monto:r2(n),estado:"solicitado",via:tipoRetiro==="otro"?"comercio":(paisRetiro==="US"?"ach":"wire"),cuenta:tipoRetiro==="otro"?(LANG==="es"?"Traspaso interno":"Internal transfer"):(paisRetiro==="US"?"Cuenta terminada en 4417":"Cuenta terminada en 4417 · "+paisRetiro),ref:""});
      formAbierto=false; render(); toast(T.ok);
    };
  }
}
function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("ver");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("ver"),4200);}
render();
</script>
</body>
</html>
