<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="900" height="640" fill="#f5f5f7"/>
  <!-- Encabezado -->
  <rect x="0" y="0" width="900" height="56" fill="#ffffff"/>
  <text x="24" y="35" font-size="20" font-weight="700" fill="#1d1d1f">Mercatren: Shop U.S. Stores</text>
  <text x="330" y="35" font-size="15" fill="#0071e3">Distribution</text>
  <!-- Título y botón que NO se toca -->
  <text x="24" y="100" font-size="13" fill="#0071e3">‹ Revisión de apps</text>
  <text x="24" y="132" font-size="24" font-weight="700" fill="#1d1d1f">Envío para iOS</text>
  <rect x="610" y="104" width="266" height="36" rx="8" fill="#e8e8ed" stroke="#d62d20" stroke-width="3"/>
  <text x="743" y="127" font-size="13" text-anchor="middle" fill="#86868b">Volver a enviar a revisión de apps</text>
  <rect x="640" y="146" width="206" height="24" rx="12" fill="#d62d20"/>
  <text x="743" y="163" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">NO SE TOCA</text>
  <!-- Mensaje de Apple -->
  <rect x="24" y="190" width="852" height="250" rx="10" fill="#ffffff" stroke="#d2d2d7"/>
  <text x="44" y="220" font-size="13" font-weight="700" fill="#1d1d1f">Apple · Hoy, 12:00</text>
  <text x="44" y="250" font-size="17" font-weight="700" fill="#1d1d1f">Guidelines 4.3 - Spam and 4.2.6 - App Generation Services</text>
  <text x="44" y="280" font-size="13" fill="#6e6e73">Issue Description · Next Steps · 1 … 9 · Resources</text>
  <line x1="44" y1="380" x2="856" y2="380" stroke="#d2d2d7"/>
  <!-- Paso 1: responder -->
  <rect x="38" y="392" width="300" height="34" rx="8" fill="none" stroke="#ff6b1a" stroke-width="3"/>
  <text x="56" y="414" font-size="14" fill="#0071e3">↩ Responder al equipo de revisión de apps</text>
  <circle cx="362" cy="409" r="15" fill="#ff6b1a"/>
  <text x="362" y="414" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <!-- Paso 2: la casilla -->
  <rect x="24" y="460" width="852" height="96" rx="10" fill="#ffffff" stroke="#ff6b1a" stroke-width="3"/>
  <text x="44" y="488" font-size="13" fill="#1d1d1f">Pega aquí el texto en inglés del documento</text>
  <text x="44" y="510" font-size="13" font-weight="700" fill="#1d1d1f">RESPUESTA-A-APPLE-BORRADOR (tienda-apps / app-store)</text>
  <text x="44" y="534" font-size="12" fill="#6e6e73">Todo el bloque, de «Hello App Review team» a «Windoce LLC». Sin cambiar nada.</text>
  
  <circle cx="852" cy="484" r="15" fill="#ff6b1a"/>
  <text x="852" y="489" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <!-- Paso 3: enviar -->
  <rect x="736" y="568" width="140" height="36" rx="8" fill="#0071e3" stroke="#ff6b1a" stroke-width="3"/>
  <text x="806" y="591" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Enviar</text>
  <circle cx="712" cy="586" r="15" fill="#ff6b1a"/>
  <text x="712" y="591" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <!-- Lo que NO se toca abajo -->
  <rect x="24" y="568" width="150" height="36" rx="8" fill="#ffffff" stroke="#d62d20" stroke-width="3"/>
  <text x="99" y="591" font-size="13" text-anchor="middle" fill="#0071e3">Cancelar envío</text>
  <rect x="184" y="574" width="110" height="24" rx="12" fill="#d62d20"/>
  <text x="239" y="591" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">NO SE TOCA</text>
  <text x="24" y="630" font-size="12" fill="#6e6e73">Tampoco «Editar» ni «Eliminar» de la tabla de elementos enviados.</text>
</svg>
