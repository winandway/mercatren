name: vigilante

# EL VIGILANTE (2 sep 2026). Cada 20 minutos le pide al sitio que mire todo
# lo que está en marcha —la importación de CJ, el afinado de precios, las
# compras al proveedor, los pagos por validar, los retiros, los catálogos de
# los comercios y el propio reloj de sincronización—, que arregle solo lo que
# pueda (retirar de la venta lo que no tiene flete real, reintentar tandas
# que fallaron por CJ ocupado) y que mande un correo al equipo cuando algo
# necesita una persona. Va en su propio flujo, aparte del reloj de
# sincronización, para poder avisar si ESE reloj se para.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

concurrency:
  group: vigilante
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedirle al sitio que vigile
        env:
          LLAVE: ${{ secrets.SINCRONIZAR_LLAVE }}
        run: |
          if [ -z "$LLAVE" ]; then
            echo "::error::Falta el secreto SINCRONIZAR_LLAVE en el repositorio."
            exit 1
          fi

          codigo=$(curl -s -o respuesta.json -w "%{http_code}" \
            --max-time 300 \
            -X POST "https://mercatren.com/datos/vigilante" \
            -H "Authorization: Bearer $LLAVE")

          echo "Respuesta HTTP: $codigo"
          # EL REGISTRO DE ESTA CORRIDA ES PÚBLICO (25 sep 2026): el
          # repositorio es público y cualquiera lee los registros de Actions.
          # La respuesta de CJ trae nombre, teléfono y dirección de quien
          # compra: dos consultas de ese día dejaron publicados un nombre real
          # y una dirección. Se tapan antes de imprimir. Lo que no es JSON se
          # corta a 400 caracteres. Candado: tests/unit/registros-sin-datos.test.ts
          jq 'walk(if type == "object" then with_entries(if (.key | test("customername|phone|address|email|zip|postal|consumer|contact|receiver|taxnumber|idnumber"; "i")) and (.value != null) then .value = "[oculto]" else . end) else . end)' respuesta.json 2>/dev/null || head -c 400 respuesta.json || true
          echo

          if [ "$codigo" = "503" ]; then
            echo "::warning::Falta cargar SINCRONIZAR_LLAVE en YaDominios Cloud."
            exit 0
          fi

          if [ "$codigo" != "200" ]; then
            echo "::error::El sitio respondio $codigo."
            exit 1
          fi

          # Las alertas rojas se ven también aquí, en el historial del flujo.
          if grep -q '"nivel":"rojo"' respuesta.json; then
            echo "::warning::Hay alertas rojas. El detalle esta arriba y en Panel -> Vigilante."
          fi
